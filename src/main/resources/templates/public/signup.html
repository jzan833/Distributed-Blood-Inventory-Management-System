<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RedHope</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">

    <!-- 3D Background Shapes -->
    <div class="auth-3d-shapes">
        <div class="auth-3d-drop"></div>
        <div class="auth-3d-ring"></div>
        <div class="auth-3d-ring"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
    </div>

    <div class="auth-container signup-container">
        <a href="/" class="auth-back-btn">
            <i class="fas fa-arrow-left me-1"></i> Back to Home
        </a>

        <div class="auth-card">
            <div class="auth-card-body">
                <div class="auth-brand">
                    <div class="auth-brand-icon">
                        <i class="fas fa-heart-pulse"></i>
                    </div>
                    <h1>Create Your Account</h1>
                    <p>Join RedHope and start saving lives</p>
                </div>

                <div th:if="${errorMessage}" class="auth-alert auth-alert-danger" role="alert">
                    <i class="fas fa-circle-exclamation"></i>
                    <div th:text="${errorMessage}"></div>
                </div>

                <form th:action="@{/signup}" method="post" th:object="${signupRequest}" id="signupForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div th:if="${#fields.hasGlobalErrors()}" class="auth-alert auth-alert-danger" role="alert">
                        <i class="fas fa-circle-exclamation"></i>
                        <div th:each="error : ${#fields.globalErrors()}" th:text="${error.defaultMessage}"></div>
                    </div>

                    <!-- Personal Information -->
                    <div class="mb-2">
                        <label class="form-label text-muted text-uppercase fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.5px;">Personal Information</label>
                    </div>

                    <div class="auth-form-group">
                        <label for="fullName">Full Name</label>
                        <div class="auth-input-wrapper">
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                   placeholder="Enter your full name" required>
                            <i class="fas fa-user input-icon"></i>
                        </div>
                        <div th:if="${#fields.hasErrors('fullName')}" class="text-danger mt-1" th:each="error : ${#fields.errors('fullName')}">
                            <small th:text="${error}"></small>
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <label for="email">Email Address</label>
                        <div class="auth-input-wrapper">
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   placeholder="name@example.com" required>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                        <div th:if="${#fields.hasErrors('email')}" class="text-danger mt-1" th:each="error : ${#fields.errors('email')}">
                            <small th:text="${error}"></small>
                        </div>
                    </div>

                    <div class="signup-form-row">
                        <div class="auth-form-group">
                            <label for="phone">Phone Number</label>
                            <div class="auth-input-wrapper">
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                                       placeholder="+1 234 567 8900" required>
                                <i class="fas fa-phone input-icon"></i>
                            </div>
                            <div th:if="${#fields.hasErrors('phone')}" class="text-danger mt-1" th:each="error : ${#fields.errors('phone')}">
                                <small th:text="${error}"></small>
                            </div>
                        </div>
                        <div class="auth-form-group">
                            <label for="city">City</label>
                            <div class="auth-input-wrapper">
                                <input type="text" class="form-control" id="city" th:field="*{city}"
                                       placeholder="Your city" required>
                                <i class="fas fa-city input-icon"></i>
                            </div>
                            <div th:if="${#fields.hasErrors('city')}" class="text-danger mt-1" th:each="error : ${#fields.errors('city')}">
                                <small th:text="${error}"></small>
                            </div>
                        </div>
                    </div>

                    <!-- Blood Information -->
                    <div class="mb-2 mt-3">
                        <label class="form-label text-muted text-uppercase fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.5px;">Blood Information</label>
                    </div>

                    <div class="auth-form-group">
                        <label for="bloodType">Blood Type</label>
                        <select class="form-select" id="bloodType" th:field="*{bloodType}" required>
                            <option value="" disabled selected>Select your blood type</option>
                            <option th:each="type : ${bloodTypes}" th:value="${type.name()}" th:text="${type.displayName}"></option>
                        </select>
                        <div th:if="${#fields.hasErrors('bloodType')}" class="text-danger mt-1" th:each="error : ${#fields.errors('bloodType')}">
                            <small th:text="${error}"></small>
                        </div>
                    </div>

                    <!-- Security -->
                    <div class="mb-2 mt-3">
                        <label class="form-label text-muted text-uppercase fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.5px;">Security</label>
                    </div>

                    <div class="auth-form-group">
                        <label for="password">Password</label>
                        <div class="auth-input-wrapper">
                            <input type="password" class="form-control" id="password" th:field="*{password}"
                                   placeholder="Create a strong password" required>
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePassword(this, document.getElementById('password'))" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div th:if="${#fields.hasErrors('password')}" class="text-danger mt-1" th:each="error : ${#fields.errors('password')}">
                            <small th:text="${error}"></small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit" id="signupSubmit">
                        <span class="spinner"></span>
                        <span class="btn-text"><i class="fas fa-user-plus me-2"></i>Create Account</span>
                    </button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="/login">Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function() {
            setSubmitLoading(this, true);
        });
    </script>
</body>
</html>
