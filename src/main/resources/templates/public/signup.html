<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အကောင့်ဝင်ရန် - RedHope</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">

    <!-- 3D Background Shapes -->
    <div class="auth-3d-shapes">
        <div class="auth-3d-drop"></div>
        <div class="auth-3d-ring"></div>
        <div class="auth-3d-ring"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
    </div>

    <div class="auth-container signup-container">
        <a href="/" class="auth-back-btn">
            <i class="fas fa-arrow-left me-1"></i> ပင်မစာမျက်နှာသို့
        </a>

        <div class="auth-card">
            <div class="auth-card-body">
                <div class="auth-brand">
                    <div class="auth-brand-icon">
                        <i class="fas fa-heart-pulse"></i>
                    </div>
                    <h1>အကောင့်သစ် ပြုလုပ်ပါ</h1>
                    <p>RedHope တွင် ပါဝင်ပြီး အသက်များကို စတင် ကယ်တင်ပါ</p></p>
                </div>

                <div th:if="${errorMessage}" class="auth-alert auth-alert-danger" role="alert">
                    <i class="fas fa-circle-exclamation"></i>
                    <div th:text="${errorMessage}"></div>
                </div>

                <form th:action="@{/signup}" method="post" th:object="${signupRequest}" id="signupForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div th:if="${#fields.hasGlobalErrors()}" class="auth-alert auth-alert-danger" role="alert">
                        <i class="fas fa-circle-exclamation"></i>
                        <div th:each="error : ${#fields.globalErrors()}" th:text="${error.defaultMessage}"></div>
                    </div>

                    <!-- Personal Information -->
                    <div class="mb-2">
                        <label class="form-label text-muted text-uppercase fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.5px;">ကိုယ်ရေးအချက်အလက်</label>
                    </div>

                    <div class="auth-form-group">
                        <label for="fullName">အမည်အပြည့်အစုံ</label>
                        <div class="auth-input-wrapper">
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                   placeholder="သင့်အမည်အပြည့်အစုံကို ရိုက်ထည့်ပါ" required>
                            <i class="fas fa-user input-icon"></i>
                        </div>
                        <div th:if="${#fields.hasErrors('fullName')}" class="text-danger mt-1" th:each="error : ${#fields.errors('fullName')}">
                            <small th:text="${error}"></small>
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <label for="email">အီးမေးလ် လိပ်စာ</label>
                        <div class="auth-input-wrapper">
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   placeholder="name@example.com" required>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                        <div th:if="${#fields.hasErrors('email')}" class="text-danger mt-1" th:each="error : ${#fields.errors('email')}">
                            <small th:text="${error}"></small>
                        </div>
                    </div>

                    <div class="signup-form-row">
                        <div class="auth-form-group">
                            <label for="phone">ဖုန်းနံပါတ်</label>
                            <div class="auth-input-wrapper">
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                                       placeholder="+95 9 123 456 789" required>
                                <i class="fas fa-phone input-icon"></i>
                            </div>
                            <div th:if="${#fields.hasErrors('phone')}" class="text-danger mt-1" th:each="error : ${#fields.errors('phone')}">
                                <small th:text="${error}"></small>
                            </div>
                        </div>
                        <div class="auth-form-group">
                            <label for="city">မြို့နယ်/မြို့</label>
                            <div class="auth-input-wrapper">
                                <input type="text" class="form-control" id="city" th:field="*{city}"
                                       placeholder="သင့်မြို့ကို ရိုက်ထည့်ပါ" required>
                                <i class="fas fa-city input-icon"></i>
                            </div>
                            <div th:if="${#fields.hasErrors('city')}" class="text-danger mt-1" th:each="error : ${#fields.errors('city')}">
                                <small th:text="${error}"></small>
                            </div>
                        </div>
                    </div>

                    <!-- Blood Information -->
                    <div class="mb-2 mt-3">
                        <label class="form-label text-muted text-uppercase fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.5px;">သွေးအမျိုးအစားဆိုင်ရာ အချက်အလက်</label>
                    </div>

                    <div class="auth-form-group">
                        <label for="bloodType">သွေးအမျိုးအစား</label>
                        <select class="form-select" id="bloodType" th:field="*{bloodType}" required>
                            <option value="" disabled selected>သွေးအမျိုးအစား ရွေးချယ်ပါ</option>
                            <option th:each="type : ${bloodTypes}" th:value="${type.name()}" th:text="${type.displayName}"></option>
                        </select>
                        <div th:if="${#fields.hasErrors('bloodType')}" class="text-danger mt-1" th:each="error : ${#fields.errors('bloodType')}">
                            <small th:text="${error}"></small>
                        </div>
                    </div>

                    <!-- Security -->
                    <div class="mb-2 mt-3">
                        <label class="form-label text-muted text-uppercase fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.5px;">လုံခြုံရေး</label>
                    </div>

                    <div class="auth-form-group">
                        <label for="password">စကားဝှက်</label>
                        <div class="auth-input-wrapper">
                            <input type="password" class="form-control" id="password" th:field="*{password}"
                                   placeholder="ခိုင်မာသော စကားဝှက်တစ်ခု ဖန်တီးပါ" required>
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePassword(this, document.getElementById('password'))" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div th:if="${#fields.hasErrors('password')}" class="text-danger mt-1" th:each="error : ${#fields.errors('password')}">
                            <small th:text="${error}"></small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit" id="signupSubmit">
                        <span class="spinner"></span>
                        <span class="btn-text"><i class="fas fa-user-plus me-2"></i>အကောင့်သစ် ပြုလုပ်ပါ</span>
                    </button>
                </form>

                <div class="auth-footer">
                    အကောင့် ရှိပြီးသားဖြစ်ပါသလား? <a href="/login">အကောင့်ဝင်ရန်</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function() {
            setSubmitLoading(this, true);
        });
    </script>
</body>
</html>
