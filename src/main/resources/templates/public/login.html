<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RedHope</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">

    <!-- 3D Background Shapes -->
    <div class="auth-3d-shapes">
        <div class="auth-3d-drop"></div>
        <div class="auth-3d-ring"></div>
        <div class="auth-3d-ring"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
        <div class="auth-3d-particle"></div>
    </div>

    <div class="auth-container">
        <a href="/" class="auth-back-btn">
            <i class="fas fa-arrow-left me-1"></i> Back to Home
        </a>

        <div class="auth-card">
            <div class="auth-card-body">
                <div class="auth-brand">
                    <div class="auth-brand-icon">
                        <i class="fas fa-heart-pulse"></i>
                    </div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your RedHope account</p>
                </div>

                <div th:if="${param.error}" class="auth-alert auth-alert-danger" role="alert">
                    <i class="fas fa-circle-exclamation"></i>
                    <div>Invalid email or password. Please try again.</div>
                </div>

                <div th:if="${param.logout}" class="auth-alert auth-alert-success" role="alert">
                    <i class="fas fa-circle-check"></i>
                    <div>You have been logged out successfully.</div>
                </div>

                <div th:if="${successMessage}" class="auth-alert auth-alert-success" role="alert">
                    <i class="fas fa-circle-check"></i>
                    <div th:text="${successMessage}"></div>
                </div>

                <form th:action="@{/login}" method="post" id="loginForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="auth-form-group">
                        <label for="email">Email address</label>
                        <div class="auth-input-wrapper">
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="name@example.com" required autofocus>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <label for="password">Password</label>
                        <div class="auth-input-wrapper">
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter your password" required>
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePassword(this, document.getElementById('password'))" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit" id="loginSubmit">
                        <span class="spinner"></span>
                        <span class="btn-text"><i class="fas fa-right-to-bracket me-2"></i>Sign In</span>
                    </button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="/signup">Sign up</a>
                </div>

                <div class="auth-security">
                    <i class="fas fa-shield-halved"></i>
                    Secured by Spring Security with BCrypt encryption
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            setSubmitLoading(this, true);
        });
    </script>
</body>
</html>
