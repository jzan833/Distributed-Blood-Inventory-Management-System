<!DOCTYPE html>
<html lang="my" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RedHope</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
</head>
<body class="auth-page auth-login">

    <div class="auth-bg" aria-hidden="true">
        <div class="aurora aurora-a"></div>
        <div class="aurora aurora-b"></div>
        <div class="grid-plane"></div>
        <div class="ring ring-a"></div>
        <div class="ring ring-b"></div>
        <div class="spark spark-a"></div>
        <div class="spark spark-b"></div>
        <div class="spark spark-c"></div>
        <div class="spark spark-d"></div>
        <div class="noise"></div>
    </div>

    <main class="auth-shell">
        <section class="auth-showcase">
            <a href="/" class="brand-lockup">
                <span class="brand-mark"><i class="fas fa-heart-pulse"></i></span>
                <span>
                    <strong>RedHope</strong>
                    <small>Blood care, connected.</small>
                </span>
            </a>

            <a href="/" class="home-btn">
                <i class="fas fa-house"></i>
                <span>မူလစာမျက်နှာ</span>
            </a>

            <div class="blood-visual" aria-hidden="true">
                <div class="visual-glow"></div>
                <div class="blood-drop">
                    <svg viewBox="0 0 220 250" role="img" aria-label="">
                        <defs>
                            <linearGradient id="dropGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff6b6b"/>
                                <stop offset="35%" stop-color="#ff3344"/>
                                <stop offset="100%" stop-color="#cc1122"/>
                            </linearGradient>
                            <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="8" result="blur"/>
                                <feMerge>
                                    <feMergeNode in="blur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <path d="M110 16C110 16 48 91 48 138c0 41 28 71 62 71s62-30 62-71c0-47-62-122-62-122z"
                              fill="url(#dropGradient)" filter="url(#dropShadow)" opacity=".96"/>
                        <path d="M80 120c4-24 18-43 30-57" fill="none" stroke="#fff" stroke-width="8"
                              stroke-linecap="round" opacity=".32"/>
                    </svg>
                </div>
                <div class="pulse-line">
                    <span></span><span></span><span></span><span></span><span></span>
                    <svg viewBox="0 0 520 100" preserveAspectRatio="none">
                        <path d="M0 56H100L128 56L150 54L168 84L185 18L201 56H285L310 55L336 55L360 88L377 10L394 56H520"
                              fill="none" />
                    </svg>
                </div>
            </div>

            <div class="showcase-footer">
                <span><i class="fas fa-shield-heart"></i> Secure account access</span>
                <span><i class="fas fa-droplet"></i> Built for RedHope</span>
            </div>
        </section>

        <section class="auth-panel">
            <div class="auth-panel-inner">
                <a href="/" class="home-btn-mobile">
                    <i class="fas fa-arrow-left"></i>
                    <span>မူလစာမျက်နှာ</span>
                </a>

                <div class="auth-heading">
                    <span class="auth-label">WELCOME BACK</span>
                    <h1>ပြန်လည်ကြိုဆိုပါတယ်</h1>
                    <p>သင့် RedHope အကောင့်ထဲကို ဝင်ရောက်ပါ။</p>
                </div>

                <div th:if="${param.error}" class="auth-alert auth-alert-danger" role="alert">
                    <i class="fas fa-circle-exclamation"></i>
                    <span>အီးမေးလ် သို့မဟုတ် စကားဝှက် မှားယွင်းနေပါသည်။</span>
                </div>

                <div th:if="${param.logout}" class="auth-alert auth-alert-success" role="alert">
                    <i class="fas fa-circle-check"></i>
                    <span>ထွက်ခွာသွားပြီးပါပြီ။</span>
                </div>

                <form th:action="@{/login}" method="post" id="loginForm" class="auth-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="auth-form-group">
                        <label for="email">အီးမေးလ်</label>
                        <div class="auth-input-wrapper">
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="name@example.com" required autofocus>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <div class="field-head">
                            <label for="password">စကားဝှက်</label>
                            <a href="/forgot-password" class="auth-forgot">မေ့နေပါသလား?</a>
                        </div>
                        <div class="auth-input-wrapper">
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="စကားဝှက်" required>
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="password-toggle"
                                    onclick="togglePassword(this, document.getElementById('password'))"
                                    aria-label="စကားဝှက် ပြ/ဖျောက်">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-options">
                        <label class="auth-remember">
                            <input type="checkbox" name="remember-me">
                            <span>မှတ်ထားပါ</span>
                        </label>
                    </div>

                    <button type="submit" class="auth-submit" id="loginSubmit">
                        <span class="spinner"></span>
                        <span class="btn-text">
                            <i class="fas fa-arrow-right-to-bracket"></i>
                            ဝင်ရောက်မည်
                        </span>
                    </button>
                </form>

                <div class="auth-divider"><span>သို့မဟုတ်</span></div>

                <div class="auth-footer">
                    <span>အကောင့်မရှိသေးဘူးလား?</span>
                    <a href="/signup">အကောင့်ဖွင့်ရန် <i class="fas fa-arrow-right"></i></a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('loginSubmit');
            btn.classList.add('loading');
            btn.disabled = true;
        });

        function togglePassword(btn, input) {
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
