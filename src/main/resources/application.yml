server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: RedHope

  datasource:
    url: jdbc:mariadb://mysql-redhope-redhope.c.aivencloud.com:14302/defaultdb?sslMode=REQUIRED
    username: avnadmin
    password: #${DB_PASSWORD}
    
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  sql:
    init:
      mode: always

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    check-template-location: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: redhope223blood@gmail.com
    password: #${MAIL_PASSWORD}
    
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    from:
      address: ${MAIL_FROM:redhope223blood@gmail.com}
      name: RedHope Blood Donation System

  messages:
    basename: messages
    encoding: UTF-8

  main:
    allow-circular-references: false

logging:
  level:
    com.redhope: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Development Profile Overrides
---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  thymeleaf:
    cache: false

logging:
  level:
    com.redhope: DEBUG
    org.springframework.security: DEBUG

---
# Production Profile Overrides
---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

logging:
  level:
    com.redhope: WARN
    org.springframework.security: WARN
    org.hibernate: WARN